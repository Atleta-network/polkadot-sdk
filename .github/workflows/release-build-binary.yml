name: Binary Build
# This workflow can be used to build a binary like polkadot + workers, omninode or polkadot-parachain
# from any branch with release or profuction profile to be later used for testing.
# ⚠️ IT should not be used for release purposes!

on:
  workflow_dispatch:
    inputs:
      binary:
        required: true
        default: "polkadot"
        description: "The binary to build"
      package:
        description: Package to be built, can be polkadot, polkadot-parachain-bin, polkadot-omni-node etc.
        required: true
        type: string
      profile:
        required: true
        default: "release"
        description: "The profile to use for the binary build"

jobs:

  setup:
    # GitHub Actions allows using 'env' in a container context.
    # However, env variables don't work for forks: https://github.com/orgs/community/discussions/44322
    # This workaround sets the container image for each job using 'set-image' job output.
    runs-on:
      group: Atleta-network
      labels: [self-hosted, Linux, X64]
    outputs:
      IMAGE: ${{ steps.set_image.outputs.IMAGE }}
      RUNNER: ${{ steps.set_runner.outputs.RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - name: Set image
        id: set_image
        run: cat .github/env >> $GITHUB_OUTPUT

      - name: Set runner
        id: set_runner
        shell: bash
        run: |
          if [[ "${{ inputs.binary }}" == "polkadot-parachain" ]]; then
            printf '%s\n' 'RUNNER=["self-hosted","Linux","X64"]' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'RUNNER=["self-hosted","Linux","X64"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [setup]
    runs-on:
      group: Atleta-network
      labels: ${{ fromJSON(needs.setup.outputs.RUNNER) }}
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.setup.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Build binary
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" #avoid "detected dubious ownership" error
          PROFILE=${{ inputs.profile }}
          if [ "${{ inputs.binary }}" = "polkadot" ]; then
              for binary in polkadot polkadot-prepare-worker polkadot-execute-worker; do
                  echo "Building $binary..."
                  ./.github/scripts/release/build-linux-release.sh $binary ${{ inputs.package }} "${PROFILE}"
              done
          else
            ./.github/scripts/release/build-linux-release.sh ${{ inputs.binary }} ${{ inputs.package }} "${PROFILE}"
          fi

      - name: Upload ${{ inputs.binary }} artifacts
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: ${{ inputs.binary }}
          path: /artifacts/**

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi
