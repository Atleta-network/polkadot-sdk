name: Build Misc

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  preflight:
    needs: isdraft
    uses: ./.github/workflows/reusable-preflight.yml

  build-runtimes-polkavm:
    timeout-minutes: 60
    needs: [preflight]
    runs-on:
      group: Atleta-network
      labels: ${{ fromJSON(needs.preflight.outputs.RUNNER) }}
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Check Rust
        run: |
          rustup show
          rustup +nightly show

      - name: Build
        env:
          SUBSTRATE_RUNTIME_TARGET: riscv
        id: required
        run: forklift cargo check -p minimal-template-runtime -p westend-runtime -p rococo-runtime -p polkadot-test-runtime
      - name: Stop all workflows if failed
        if: ${{ failure() && steps.required.conclusion == 'failure' && !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

  # As part of our test fixtures we build the revive-uapi crate always with the `unstable-hostfn` feature.
  # To make sure that it won't break for users downstream which are not setting this feature
  # It doesn't need to produce working code so we just use a similar enough RISC-V target

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi

  check-revive-stable-uapi-polkavm:
    timeout-minutes: 30
    needs: [preflight]
    runs-on:
      group: Atleta-network
      labels: ${{ fromJSON(needs.preflight.outputs.RUNNER) }}
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Check Rust
        run: |
          rustup show
          rustup +nightly show

      - name: Build
        id: required
        run: forklift cargo +nightly check -p pallet-revive-uapi --no-default-features --target riscv64imac-unknown-none-elf -Zbuild-std=core
      - name: Stop all workflows if failed
        if: ${{ failure() && steps.required.conclusion == 'failure' && !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi

  build-subkey:
    timeout-minutes: 20
    needs: [preflight]
    runs-on:
      group: Atleta-network
      labels: ${{ fromJSON(needs.preflight.outputs.RUNNER) }}
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Check Rust
        run: |
          rustup show
          rustup +nightly show

      - name: Build
        env:
          SKIP_WASM_BUILD: 1
        id: required
        run: |
          cd ./substrate/bin/utils/subkey
          forklift cargo build --locked --release
      - name: Stop all workflows if failed
        if: ${{ failure() && steps.required.conclusion == 'failure' && !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi

  confirm-required-build-misc-jobs-passed:
    runs-on:
      group: Atleta-network
      labels: [self-hosted, Linux, X64]
    name: All build misc jobs passed
    # If any new job gets added, be sure to add it to this array
    needs: [build-runtimes-polkavm, build-subkey]
    if: always() && !cancelled()
    steps:
      - run: |
          tee resultfile <<< '${{ toJSON(needs) }}'
          FAILURES=$(cat resultfile | grep '"result": "failure"' | wc -l)
          if [ $FAILURES -gt 0 ]; then
            echo "### At least one required job failed ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '### Good job! All the required jobs passed 🚀' >> $GITHUB_STEP_SUMMARY
          fi
