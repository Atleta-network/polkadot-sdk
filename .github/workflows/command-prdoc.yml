name: Command PrDoc

on:
  workflow_dispatch:
    inputs:
      pr:
        type: number
        description: Number of the Pull Request
        required: true
      bump:
        type: choice
        description: Default bump level for all crates
        default: "TODO"
        required: true
        options:
          - "TODO"
          - "none"
          - "patch"
          - "minor"
          - "major"
      audience:
        type: choice
        description: Audience of the PrDoc
        default: "TODO"
        required: true
        options:
          - "TODO"
          - "runtime_dev"
          - "runtime_user"
          - "node_dev"
          - "node_operator"
      overwrite:
        type: boolean
        description: Overwrite existing PrDoc
        default: true
        required: true

concurrency:
  group: command-prdoc
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/reusable-preflight.yml

  cmd-prdoc:
    needs: [preflight]
    runs-on:
      group: Atleta-network
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 20
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.preflight.outputs.IMAGE }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Install gh cli
        id: gh
        uses: ./.github/actions/set-up-gh
        with:
          pr-number: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
      - name: Generate PrDoc
        run: |
          python3 -m pip install -q cargo-workspace PyGithub whatthepatch pyyaml toml

          python3 .github/scripts/generate-prdoc.py --pr "${{ inputs.pr }}" --bump "${{ inputs.bump }}" --audience "${{ inputs.audience }}" --force "${{ inputs.overwrite }}"

      - name: Report failure
        if: ${{ failure() }}
        run: gh pr comment ${{ inputs.pr }} --body "<h2>Command failed ❌</h2> Run by @${{ github.actor }} for <code>${{ github.workflow }}</code> failed. See logs <a href=\"$RUN\">here</a>."
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
      - name: Push Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add PrDoc (auto generated)
          branch: ${{ steps.gh.outputs.branch }}
          file_pattern: "prdoc/*.prdoc"

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi
