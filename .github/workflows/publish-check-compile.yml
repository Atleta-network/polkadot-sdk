name: Check publish build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  preflight:
    needs: isdraft
    uses: ./.github/workflows/reusable-preflight.yml

  check-publish-compile:
    timeout-minutes: 90
    needs: [preflight]
    runs-on:
      group: Atleta-network
      labels: ${{ fromJSON(needs.preflight.outputs.RUNNER) }}
    container:
      volumes:
        - /opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/sccache:/opt/runner-cargo-cache/sccache:ro
        - ${{ ((!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.issue.pull_request) && '/opt/runner-cargo-cache/groups/atleta-network/hooks/cargo-cache/client.env:/run/secrets/cargo_cache_env:ro' || '/dev/null:/run/secrets/cargo_cache_env:ro' }}
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - uses: actions/checkout@6d193bf28034eafb982f37bd894289fe649468fc # v4.1.7

      - name: Configure runner Cargo cache
        uses: ./.github/actions/cargo-cache

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          cache-on-failure: true

      - name: install parity-publish
        run: |
          rustup override set 1.82.0
          cargo install parity-publish@0.10.4 --locked -q

      - name: parity-publish update plan
        run: parity-publish --color always plan --skip-check --prdoc prdoc/

      - name: parity-publish apply plan
        run: parity-publish --color always apply --registry

      - name: parity-publish check compile
        run: |
          packages="$(parity-publish apply --print)"

          if [ -n "$packages" ]; then
            cargo --color always check $(printf -- '-p %s ' $packages)
          fi

      - name: Report runner Cargo cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCCACHE_SERVER_UDS:-}" ]]; then
            /opt/runner-cargo-cache/sccache --show-stats 2>/dev/null | sed -n \
              -e '/^Compile requests /p' -e '/^Cache hits /p' -e '/^Cache misses /p' || :
            /opt/runner-cargo-cache/sccache --stop-server >/dev/null 2>&1 || :
          fi
