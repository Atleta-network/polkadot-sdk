name: Configure runner Cargo cache
description: Enable the trusted group cache inside a job container
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        set +x
        if [[ ! -s /run/secrets/cargo_cache_env ]]; then
          echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
          exit 0
        fi
        set -a
        # shellcheck disable=SC1091
        . /run/secrets/cargo_cache_env
        set +a
        printf '::add-mask::%s\n' "$SCCACHE_WEBDAV_PASSWORD"
        for name in SCCACHE_WEBDAV_ENDPOINT SCCACHE_WEBDAV_USERNAME SCCACHE_WEBDAV_PASSWORD \
          SCCACHE_WEBDAV_DISABLE_CREATE_DIR SCCACHE_SKIP_CACHE_CHECK \
          CARGO_CACHE_AUTO_CLEAN_FREQUENCY; do
          printf '%s=%s\n' "$name" "${!name-}" >> "$GITHUB_ENV"
        done
        session="$(mktemp -d /tmp/sdk-sccache.XXXXXX)"
        printf '%s\n' 'RUSTC_WRAPPER=/opt/runner-cargo-cache/sccache' \
          'CARGO_INCREMENTAL=0' 'SCCACHE_IGNORE_SERVER_IO_ERROR=1' \
          'FORKLIFT_BYPASS=true' "SCCACHE_SERVER_UDS=$session/server.sock" >> "$GITHUB_ENV"
